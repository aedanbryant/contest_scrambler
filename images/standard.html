<!DOCTYPE html>
<html>

<head>
  <meta charset="utf8" />
  <!-- <title></title> -->
   <style>
	html,
	body {
		margin: 0;
		padding: 0;
		width: 100%;

		font-family: Arial, sans-serif;

		display: grid;
		place-content: center;
	}

	body,
	select,
	input {
		font-family: Ubuntu, sans-serif;
		font-size: 1.1rem;
	}

	.main {
		margin: 1em;
		display: grid;
		gap: 0.5em;
	}

	.header {
		display: grid;
		grid-template-columns: 1fr auto;
		gap: 0.5em;
	}
	.header .title {
		display: grid;
		place-content: center;
		grid-column: 1 / 3;
	}
	.header select {
		text-align: right;
	}

	.centered-text {
		font-size: 1.5rem;
		text-align: center;
	}

	table {
		width: 8in;
		height: 9.5in;
		border-collapse: collapse;
		margin: auto;

		border: 4px solid #888;
	}

	tbody:last-child {
		border-top: 5px double #888;
	}

	table td {
		border: 2px solid #888;
		padding: 0.5em;
		white-space: pre-wrap;
	}

	table td:last-child {
		width: 160px;
	}

	table a {
		color: black;
		text-decoration: none;
	}

	table a:hover {
		text-decoration: underline;
	}

	table td:last-child {
		padding: 0.1em;
		text-align: right;
	}

	@media print {
		.main {
			margin-bottom: 0;
		}
		.header input::placeholder {
			opacity: 0;
		}
		select,
		input {
			border: none;
		}
	}

	twisty-player {
		min-width: 1.25in;
		max-width: 2in;
		width: auto;
		height: 1.2in;
	}

	twisty-player.dim {
		opacity: 0.1;
	}
   </style>
</head>

<body>
	<p class="centered-text">$comp_name</p>
	<p class="centered-text">$event_name Round $round Scramble Set $group</p>

	<script type="module">
	import { TwistyPlayer } from "https://cdn.cubing.net/v0/js/cubing/twisty";


	const puzzle_id = "$puzzle_id"
	const num_scrambles = $num_scrambles
	const num_extras = $num_extras
	const scrambles = $scrambles
	const extras = $extras


	const table = document.createElement('table')

	function addScramble(tbody, scramble, i, extra, puzzleID) {
		const tr = tbody.appendChild(document.createElement("tr"));
		tr.appendChild(document.createElement("td")).textContent = (extra ? "E" : "") + i + ".";
		const scrambleTD = tr.appendChild(document.createElement("td"));
		scrambleTD.textContent = scramble;
		const playerTD = tr.appendChild(document.createElement("td"));
		const player = new TwistyPlayer({
			puzzle: puzzleID,
			alg: scramble,
			visualization: "2D",
			controlPanel: "none",
			background: "none",
			experimentalStickeringMaskOrbits: "$stickering_mask"
		});
		playerTD.appendChild(player);
	}

	function addBody(num, scrambles, puzzle_id, extra) {
		const tbody = table.appendChild(document.createElement("tbody"));
		for (let i = 0; i < num; i++) {
			addScramble(tbody, scrambles[i], i+1, extra, puzzle_id);
		}
	}

	if (num_scrambles > 0) {
		addBody(num_scrambles, scrambles, puzzle_id, false);
	}
	if (num_extras > 0) {
		addBody(num_extras, extras, puzzle_id, true);
	}
	document.body.appendChild(table);

	</script>
</body>

</html>
